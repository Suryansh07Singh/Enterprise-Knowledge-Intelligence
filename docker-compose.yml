version: '3.8'

services:
  # 1. FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag_enterprise_backend
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - DATABASE_URL=sqlite+aiosqlite:///./enterprise_rag.db
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - PRIMARY_LLM_PROVIDER=gemini
    depends_on:
      - redis
      - qdrant
    volumes:
      - ./data:/app/data
    restart: always

  # 2. Next.js Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag_enterprise_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: always

  # 3. Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.8.0
    container_name: rag_enterprise_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  # 4. Redis Cache & Job Engine
  redis:
    image: redis:7-alpine
    container_name: rag_enterprise_redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  qdrant_data:
